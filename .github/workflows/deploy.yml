
name: Publiceer mijn fitness-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Haal websitebestanden op
        uses: actions/checkout@v4

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mijn fitness-app
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./fitnessapp/dist

      - name: Publiceer mijn fitness-app
        id: deployment
        uses: actions/deploy-pages@v4
