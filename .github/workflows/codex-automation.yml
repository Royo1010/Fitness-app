name: Vertrouwde Codex-publicatie

on:
  workflow_run:
    workflows: [Controleer en publiceer Ritme]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: codex-publication-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automate:
    if: >-
      vars.CODEX_AUTOMATION_ENABLED == 'true' &&
      github.repository == 'Royo1010/Fitness-app' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      startsWith(github.event.workflow_run.head_branch, 'codex/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run is privileged: checkout only trusted main, never the branch or artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Maak tijdelijk token voor uitsluitend deze repository
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: Royo1010
          repositories: Fitness-app
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - name: Controleer herkomst en maak PR of merge geteste commit
        uses: actions/github-script@v7
        env:
          CODEX_AUTOMATION_ENABLED: ${{ vars.CODEX_AUTOMATION_ENABLED }}
          CODEX_TRUSTED_ACTOR_ID: ${{ vars.CODEX_TRUSTED_ACTOR_ID }}
          CODEX_APP_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const {run} = require('./.github/scripts/codex-automation.cjs');
            await run({github, context, core});
