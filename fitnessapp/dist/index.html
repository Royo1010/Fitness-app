<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f5">
  <meta name="description" content="Jouw vaste Upper/Lower-programma. Train op je eigen tempo en registreer je beste set, ook offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Paint a matching system-theme surface before modules or IndexedDB load.
    // applyTheme() applies the saved preference and synchronizes this color later.
    (() => {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#131917' : '#eef2f5';
    })();
  </script>
  <title>Ritme — jouw persoonlijke training</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./training.css">
</head>
<body>
  <div id="app" tabindex="0" role="region" aria-label="Ritme app-inhoud"><div class="boot"><span class="brand-mark">r.</span><p>Even je training klaarzetten…</p></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script type="module" src="./app.mjs"></script>
  <noscript>Schakel JavaScript in om je trainingen in Ritme bij te houden.</noscript>
</body>
</html>
